<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>OG Image — My Second Brain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #eee; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .og {
            width: 1200px;
            height: 630px;
            background: #FAF8F5;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* Subtle background texture */
        .og::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, #D4E2DB 0%, transparent 70%);
            opacity: 0.4;
        }
        .og::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -60px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, #E8A598 0%, transparent 70%);
            opacity: 0.15;
        }
        .og-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .og-logo {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .og-wordmark {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 400;
            color: #2D3436;
            letter-spacing: -0.5px;
        }
        .og-wordmark em {
            font-style: italic;
            font-weight: 500;
        }
        .og-tagline {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 24px;
            font-weight: 300;
            color: #636E72;
            letter-spacing: 0.5px;
        }
        .og-divider {
            width: 60px;
            height: 2px;
            background: #E8A598;
        }
        .og-url {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #7A9A8C;
            letter-spacing: 1px;
        }
        /* Bottom accent bar */
        .og-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #5B7B6D, #7A9A8C, #E8A598);
        }
    </style>
</head>
<body>
    <div class="og">
        <div class="og-content">
            <div class="og-logo">
                <svg width="72" height="72" viewBox="0 0 52 52" fill="none">
                    <circle cx="26" cy="26" r="5" fill="#5B7B6D"/>
                    <circle cx="25" cy="25" r="2" fill="#7A9A8C"/>
                    <ellipse cx="26" cy="26" rx="18" ry="8" stroke="#5B7B6D" stroke-width="1.4" fill="none" transform="rotate(-20 26 26)" opacity="0.6"/>
                    <ellipse cx="26" cy="26" rx="18" ry="8" stroke="#7A9A8C" stroke-width="1.4" fill="none" transform="rotate(40 26 26)" opacity="0.45"/>
                    <ellipse cx="26" cy="26" rx="18" ry="8" stroke="#D4E2DB" stroke-width="1.3" fill="none" transform="rotate(-70 26 26)" opacity="0.35"/>
                    <circle cx="40" cy="18" r="2.8" fill="#E8A598"/>
                    <circle cx="13" cy="21" r="2" fill="#E8A598" opacity="0.55"/>
                    <circle cx="33" cy="39" r="1.6" fill="#E8A598" opacity="0.4"/>
                </svg>
                <span class="og-wordmark">My <em>Second Brain</em></span>
            </div>
            <div class="og-divider"></div>
            <p class="og-tagline">AI-powered relief for the mental load</p>
            <p class="og-url">mysecondbrain.xyz</p>
        </div>
        <div class="og-bar"></div>
    </div>

    <script>
        // Instructions: Open this page in Chrome, then screenshot the 1200x630 card
        // Or use a screenshot tool to capture just the .og element
        console.log('Take a screenshot of the OG card (1200x630) and save as og-image.png');
    </script>
</body>
</html>
